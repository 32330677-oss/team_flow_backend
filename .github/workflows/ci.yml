# Runs the backend tests on every push and pull request.
# Uses a throw-away MySQL inside GitHub Actions; never touches production.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      TEST_DB_NAME: team_flow_test
      TEST_MYSQL_CLI: mysql -h127.0.0.1 -P3306 -uroot -proot
      STORAGE_DRIVER: local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check MySQL client
        run: mysql --version && mysql -h127.0.0.1 -P3306 -uroot -proot -e "SELECT VERSION();"

      - name: Run tests
        run: npm test
